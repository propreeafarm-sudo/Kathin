      @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap');

      .app-shell, .app-shell * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
      .app-shell h1, .app-shell h2, .app-shell h3, .app-shell h4, .sidebar-title, .btn, .nav-btn {
        font-family: 'Kanit', sans-serif;
      }
      .app-shell {
        display: flex;
        min-height: 100vh;
        background:
          radial-gradient(circle at 100% 0%, rgba(184,134,59,0.07), transparent 45%),

        color: #21302C;
      }

      }

      .sidebar {
        width: 232px; flex-shrink: 0; color: #F5F3ED;

        box-shadow: 3px 0 18px rgba(10, 24, 20, 0.18);
        position: relative; z-index: 5;
      }

      }
      .sidebar-logo {
        width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex-shrink: 0;

        background: #fff;
      }
      .sidebar-title { font-weight: 600; font-size: 14.5px; color: #F5F3ED; line-height: 1.3; }
      .sidebar-sub { font-size: 10.5px; color: #9FB0AA; margin-top: 2px; }
      .sidebar nav { display: flex; flex-direction: column; gap: 3px; flex: 1; }

      .nav-btn:hover { background: rgba(255,255,255,0.06); color: #fff; }

      .save-note { font-size: 12px; color: #4C7A5E; }

        display: flex; align-items: center; gap: 8px; padding: 10px 20px; background: #FBEAEA; color: #862F2F;
        font-size: 12.5px; border-bottom: 1px solid #F0C9C9;
      }
      .warn-banner span { flex: 1; }
      .only-mobile { display: none; }
      .content-scroll { padding: 22px 26px 60px; overflow-x: hidden; }

      .view-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; flex-wrap: wrap; }
      .view-header h2 { margin: 0 0 2px; font-size: 20px; }
      .muted { color: #6B7268; font-size: 13px; margin: 0; }
      .muted.small { font-size: 12px; }

      /* Buttons */
      .btn {
        display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 8px;
        border: 1px solid transparent; font-size: 13.5px; font-weight: 500; cursor: pointer;
        transition: background .15s, transform .1s, box-shadow .15s;
      }
      .btn-primary { background: #1F3D3A; color: #fff; box-shadow: 0 2px 8px rgba(31,61,58,0.25); }
      .btn-primary:hover { background: #163029; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(31,61,58,0.32); }
      .btn-ghost { background: transparent; color: #21302C; border-color: #D8D4C8; }
      .btn-ghost:hover { background: #EFEDE3; }
      .btn-danger { background: #A23B3B; color: #fff; }
      .btn-danger:hover { background: #862F2F; }
      .icon-btn {
        background: transparent; border: none; cursor: pointer; padding: 6px; border-radius: 6px; color: #21302C;
        display: inline-flex; align-items: center; transition: background .15s;
      }
      .icon-btn:hover { background: #EFEDE3; }
      .icon-btn.danger:hover { background: #FBE9E9; color: #A23B3B; }

      .stat-card {
        background: #fff; border: 1px solid #E2DFD5; border-radius: 12px; padding: 16px;
        box-shadow: 0 2px 10px rgba(31,61,58,0.05); transition: transform .15s, box-shadow .15s;
      }
      .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(31,61,58,0.10); }
      .stat-top { display: flex; justify-content: space-between; align-items: center; color: #6B7268; }
      .stat-top svg { background: #F0EEE5; padding: 5px; border-radius: 7px; width: 26px; height: 26px; box-sizing: border-box; color: #1F3D3A; }
      .tone-sage .stat-top svg { background: #E4EFE7; color: #4C7A5E; }
      .tone-brick .stat-top svg { background: #FBEAEA; color: #A23B3B; }
      .tone-gold .stat-top svg { background: #F6EDDA; color: #B8863B; }
      .stat-label { font-size: 12px; }
      .stat-value { font-family: 'Kanit', sans-serif; font-size: 24px; font-weight: 600; margin-top: 8px; color: #1F3D3A; }
      .stat-sub { font-size: 11.5px; color: #8A9188; margin-top: 3px; }
      .tone-sage .stat-value { color: #4C7A5E; }
      .tone-brick .stat-value { color: #A23B3B; }
      .tone-gold .stat-value { color: #B8863B; }

      /* Seal / signature element */
      .seal-row {
        display: flex; align-items: center; gap: 26px; border-radius: 14px; padding: 22px 26px; margin-bottom: 20px;
        background: linear-gradient(120deg, #17332D 0%, #1F3D3A 55%, #24463F 100%);
        box-shadow: 0 8px 24px rgba(19, 40, 36, 0.25); position: relative; overflow: hidden;
      }
      .seal-row::before {
        content: ""; position: absolute; inset: 0;
        background: radial-gradient(circle at 85% 20%, rgba(228,201,137,0.16), transparent 55%);
        pointer-events: none;
      }
      .seal { flex-shrink: 0; }
      .seal-ring {
        width: 132px; height: 132px; border-radius: 50%; border: 3px double #E4C989;
        display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        color: #E4C989; gap: 4px; padding: 10px; background: rgba(255,255,255,0.04);
        box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      }
      .seal-logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px rgba(228,201,137,0.5); }
      .seal-figure { font-family: 'Kanit', sans-serif; font-weight: 700; font-size: 16px; color: #fff; }
      .seal-caption { font-size: 9px; line-height: 1.2; color: #C9D3CD; }
      .seal-note { font-size: 12.5px; color: #D9E0DA; margin: 0; position: relative; z-index: 1; }

      /* Charts */
      .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .card { background: #fff; border: 1px solid #E2DFD5; border-radius: 12px; padding: 16px; box-shadow: 0 2px 10px rgba(31,61,58,0.05); }
      .chart-card h4 { margin: 0 0 8px; font-size: 14px; color: #1F3D3A; }

      /* Filter bar */
      .filter-bar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
      .filter-bar select {
        padding: 8px 10px; border-radius: 8px; border: 1px solid #D8D4C8; background: #fff; font-size: 13px; color: #21302C;
      }
      .search-box {
        display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px;
        border: 1px solid #D8D4C8; background: #fff; flex: 1; min-width: 200px; color: #8A9188;

      .search-box input { border: none; outline: none; flex: 1; font-size: 13px; color: #21302C; }

        font-size: 12px; border-bottom: 1px solid #E2DFD5; white-space: nowrap;

      .positive { color: #4C7A5E; font-weight: 600; }
      .negative { color: #A23B3B; font-weight: 600; }
      .row-actions { display: flex; gap: 4px; }

      .badge-ok { background: #E4EFE7; color: #4C7A5E; }
      .badge-off { background: #F0EDE5; color: #8A9188; }

        background: #fff; border: 1px dashed #D8D4C8; border-radius: 12px; text-align: center;

      .empty-state p { margin: 0; font-size: 13.5px; }

        align-items: flex-start; justify-content: center; padding: 30px 16px; z-index: 50; overflow-y: auto;
      }
      .modal-panel { background: #fff; border-radius: 14px; width: 100%; max-width: 640px; max-height: 92vh; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(10,24,20,0.3); }
      .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #E2DFD5; }
      .modal-head h3 { margin: 0; font-size: 16px; }
      .modal-body { padding: 16px 20px; overflow-y: auto; }
      fieldset { border: none; padding: 0; margin: 0 0 18px; }
      legend { font-family: 'Kanit', sans-serif; font-size: 13px; font-weight: 600; color: #1F3D3A; padding: 0 0 8px; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
      .form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: #4B564F; }
      .form-grid label.span-2 { grid-column: span 2; }
      .form-grid input, .form-grid select, textarea {
        padding: 8px 10px; border: 1px solid #D8D4C8; border-radius: 7px; font-size: 13.5px; color: #21302C; font-family: 'Sarabun', sans-serif;
      }
      .checkbox-row { flex-direction: row !important; align-items: center; gap: 8px !important; grid-column: span 2; }
      .mini-total { text-align: right; font-weight: 600; color: #1F3D3A; font-size: 13px; margin-top: 4px; }
      .full-note { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: #4B564F; margin-bottom: 8px; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 10px; padding-top: 10px; }

      .confirm-panel {
        background: #fff; border-radius: 14px; padding: 24px; max-width: 360px; width: 100%;
        display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; margin-top: 60px;
        box-shadow: 0 20px 50px rgba(10,24,20,0.3);
      }

      .baseline-card h4 { margin: 0 0 6px; color: #1F3D3A; }

      /* Report */
      .report-sheet { background: #fff; border: 1px solid #E2DFD5; border-radius: 12px; padding: 26px 30px; box-shadow: 0 2px 10px rgba(31,61,58,0.05); }
      .report-header { display: flex; gap: 16px; align-items: center; border-bottom: 2px solid #1F3D3A; padding-bottom: 16px; margin-bottom: 10px; }
      .report-logo { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 2px solid #B8863B; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
      .report-header h2 { margin: 0; font-size: 18px; color: #1F3D3A; }
      .report-header p { margin: 2px 0 0; font-size: 12.5px; }
      .report-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 20px; }
      .report-stats > div { background: #F7F5EF; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; border-left: 3px solid #B8863B; }
      .report-stats span { font-size: 11px; color: #6B7268; }
      .report-stats strong { font-size: 15px; color: #1F3D3A; }
      .report-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
      .report-table th, .report-table td { border: 1px solid #E2DFD5; padding: 6px 8px; text-align: left; }
      .report-table th { background: #F0EEE5; }
      .report-sign { display: flex; justify-content: space-between; margin-top: 40px; font-size: 12.5px; gap: 20px; }
      .report-sign p { margin: 4px 0; }

      /* Print */
      @media print {
        .no-print { display: none !important; }
        .app-shell { background: #fff; display: block; }
        .main-content { display: block; }
        .content-scroll { padding: 0; }
        .report-sheet { border: none; padding: 0; }
      }

      /* Responsive */
      @media (max-width: 860px) {
        .sidebar { position: fixed; left: -240px; top: 0; bottom: 0; z-index: 40; transition: left .2s; box-shadow: 4px 0 16px rgba(0,0,0,.2); }
        .sidebar.open { left: 0; }
        .only-mobile { display: inline-flex; }
        .stat-grid { grid-template-columns: 1fr 1fr; }
        .chart-grid { grid-template-columns: 1fr; }
        .form-grid { grid-template-columns: 1fr; }
        .form-grid label.span-2 { grid-column: span 1; }
        .checkbox-row { grid-column: span 1; }
        .report-stats { grid-template-columns: 1fr 1fr; }
        .seal-row { flex-direction: column; text-align: center; }
      }
